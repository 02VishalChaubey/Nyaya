<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background glow -->
    <radialGradient id="treeBgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#1E293B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Isometric Surface Gradients -->
    <linearGradient id="isoTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="isoLeftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="isoRightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1329" />
    </linearGradient>

    <!-- Gold & Brass Gradients -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="goldFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Cyan Glowing Neon -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow3D" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="450" cy="380" rx="380" ry="180" fill="url(#treeBgGlow)" />

  <!-- BASE ISOMETRIC PODIUM -->
  <g filter="url(#dropShadow3D)">
    <!-- Base Top Polygon -->
    <path d="M 450,420 L 730,500 L 450,580 L 170,500 Z" fill="#0B1329" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Base Front Left Side -->
    <path d="M 170,500 L 450,580 L 450,605 L 170,525 Z" fill="#030712" />
    <!-- Base Front Right Side -->
    <path d="M 450,580 L 730,500 L 730,525 L 450,605 Z" fill="#070D1B" />
  </g>

  <!-- ISOMETRIC 3D TREE TRUNK / PILLAR OF CONSTITUTION -->
  <!-- Floating Main Pedestal (Center) -->
  <g filter="url(#dropShadow3D)">
    <!-- Center Column Shaft -->
    <path d="M 410,240 L 490,240 L 490,440 L 410,440 Z" fill="url(#isoLeftGrad)" />
    <path d="M 450,250 L 490,240 L 490,440 L 450,450 Z" fill="url(#isoRightGrad)" />
    <!-- Column Fluting lines -->
    <line x1="430" y1="245" x2="430" y2="445" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />
    <line x1="470" y1="245" x2="470" y2="445" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />

    <!-- 3D Constitution Codex at Center Crown -->
    <!-- Lower Plinth -->
    <path d="M 450,150 L 530,195 L 450,240 L 370,195 Z" fill="url(#isoTopGrad)" stroke="#38BDF8" stroke-width="2" />
    <path d="M 370,195 L 450,240 L 450,258 L 370,213 Z" fill="#091024" />
    <path d="M 450,240 L 530,195 L 530,213 L 450,258 Z" fill="#0E172F" />

    <!-- 3D Gold Book: The Constitution of India -->
    <g transform="translate(415, 120)">
      <!-- Book thickness -->
      <path d="M 0,25 L 70,55 L 70,75 L 0,45 Z" fill="#78350F" />
      <path d="M 70,55 L 70,75 L 10,95 L 10,75 Z" fill="#451A03" />
      <!-- Book cover top face -->
      <path d="M 0,25 L 70,0 L 80,45 L 10,70 Z" fill="url(#goldTop)" stroke="#FEF08A" stroke-width="1" />
      <!-- Ashoka Emblem on Cover -->
      <circle cx="40" cy="35" r="10" fill="#92400E" stroke="#FEF08A" stroke-width="1" />
      <line x1="40" y1="28" x2="40" y2="42" stroke="#FEF08A" stroke-width="0.8" />
      <line x1="33" y1="35" x2="47" y2="35" stroke="#FEF08A" stroke-width="0.8" />
    </g>
  </g>

  <!-- 3D BRANCHING CONNECTORS (The 3 Tree Limbs) -->
  <!-- Branch 1: Left Branch (Fundamental Rights) -->
  <g>
    <!-- Cyan Energy Conduit Path -->
    <path d="M 450,270 C 320,290 260,320 220,340" fill="none" stroke="url(#cyanNeon)" stroke-width="4" filter="url(#softGlow)" />
    <path d="M 450,270 C 320,290 260,320 220,340" fill="none" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- 3D Left Floating Pod (Fundamental Rights) -->
    <g filter="url(#dropShadow3D)">
      <path d="M 220,310 L 290,345 L 220,380 L 150,345 Z" fill="url(#isoTopGrad)" stroke="#38BDF8" stroke-width="1.5" />
      <path d="M 150,345 L 220,380 L 220,395 L 150,360 Z" fill="#040817" />
      <path d="M 220,380 L 290,345 L 290,360 L 220,395 Z" fill="#0B132B" />

      <!-- 3D Scales of Justice on Left Pod -->
      <g transform="translate(195, 275)">
        <line x1="25" y1="10" x2="25" y2="45" stroke="#FDE047" stroke-width="2.5" />
        <line x1="5" y1="20" x2="45" y2="20" stroke="#FDE047" stroke-width="2" />
        <!-- Pan 1 -->
        <line x1="5" y1="20" x2="0" y2="35" stroke="#FDE047" stroke-width="1" />
        <line x1="5" y1="20" x2="10" y2="35" stroke="#FDE047" stroke-width="1" />
        <ellipse cx="5" cy="35" rx="9" ry="3" fill="#B45309" stroke="#FDE047" stroke-width="1" />
        <!-- Pan 2 -->
        <line x1="45" y1="20" x2="40" y2="35" stroke="#FDE047" stroke-width="1" />
        <line x1="45" y1="20" x2="50" y2="35" stroke="#FDE047" stroke-width="1" />
        <ellipse cx="45" cy="35" rx="9" ry="3" fill="#B45309" stroke="#FDE047" stroke-width="1" />
      </g>
    </g>
  </g>

  <!-- Branch 2: Center-Right Branch (Judiciary / Court Hierarchy) -->
  <g>
    <!-- Gold / Brass Energy Conduit Path -->
    <path d="M 450,270 C 490,300 560,320 660,310" fill="none" stroke="#F59E0B" stroke-width="4" filter="url(#softGlow)" />
    <path d="M 450,270 C 490,300 560,320 660,310" fill="none" stroke="#FEF08A" stroke-width="1.5" />

    <!-- 3D Right Floating Pod (Courts of India) -->
    <g filter="url(#dropShadow3D)">
      <path d="M 660,280 L 730,315 L 660,350 L 590,315 Z" fill="url(#isoTopGrad)" stroke="#F59E0B" stroke-width="1.5" />
      <path d="M 590,315 L 660,350 L 660,365 L 590,330 Z" fill="#080D1D" />
      <path d="M 660,350 L 730,315 L 730,330 L 660,365 Z" fill="#141E38" />

      <!-- 3D Supreme Court Apex Dome & Pillars -->
      <g transform="translate(635, 240)">
        <!-- Dome -->
        <path d="M 12,25 C 12,10 38,10 38,25 Z" fill="url(#goldTop)" stroke="#FEF08A" stroke-width="1" />
        <!-- Spire -->
        <line x1="25" y1="5" x2="25" y2="12" stroke="#FEF08A" stroke-width="2" />
        <circle cx="25" cy="4" r="2" fill="#FEF08A" />
        <!-- Architrave & Pillars -->
        <rect x="8" y="25" width="34" height="4" fill="#FEF08A" />
        <line x1="12" y1="29" x2="12" y2="44" stroke="#FDE047" stroke-width="2" />
        <line x1="20" y1="29" x2="20" y2="44" stroke="#FDE047" stroke-width="2" />
        <line x1="30" y1="29" x2="30" y2="44" stroke="#FDE047" stroke-width="2" />
        <line x1="38" y1="29" x2="38" y2="44" stroke="#FDE047" stroke-width="2" />
        <rect x="6" y="44" width="38" height="4" fill="#D97706" />
      </g>
    </g>
  </g>

  <!-- Branch 3: Lower Center Pod (Statutory Framework / Legal Codes) -->
  <g>
    <!-- Conduit Path to Lower Pod -->
    <path d="M 450,440 L 450,470" fill="none" stroke="#818CF8" stroke-width="4" filter="url(#softGlow)" />
    <path d="M 450,440 L 450,470" fill="none" stroke="#E0E7FF" stroke-width="1.5" />

    <!-- 3D Lower Pod (Acts & Codes) -->
    <g filter="url(#dropShadow3D)">
      <path d="M 450,445 L 515,475 L 450,505 L 385,475 Z" fill="url(#isoTopGrad)" stroke="#818CF8" stroke-width="1.5" />
      <path d="M 385,475 L 450,505 L 450,518 L 385,488 Z" fill="#070C1B" />
      <path d="M 450,505 L 515,475 L 515,488 L 450,518 Z" fill="#111B34" />

      <!-- 3D Shield & Gavel on Lower Pod -->
      <g transform="translate(432, 420)">
        <path d="M 18,5 L 34,10 L 34,26 C 34,36 18,44 18,44 C 18,44 2,36 2,26 L 2,10 Z" fill="#4338CA" stroke="#A5B4FC" stroke-width="1.5" />
        <path d="M 18,12 L 28,15 L 28,26 C 28,32 18,37 18,37 C 18,37 8,32 8,26 L 8,15 Z" fill="#6366F1" />
      </g>
    </g>
  </g>

  <!-- Floating 3D Isometric Labels / Badges with glowing pins -->
  <!-- Top Node: Constitution -->
  <g transform="translate(450, 75)">
    <rect x="-100" y="-18" width="200" height="34" rx="17" fill="#0B1329" stroke="#38BDF8" stroke-width="1.5" filter="url(#dropShadow3D)" />
    <circle cx="-80" cy="-1" r="5" fill="#38BDF8" />
    <text x="5" y="4" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">THE CONSTITUTION</text>
  </g>

  <!-- Left Node: Fundamental Rights -->
  <g transform="translate(145, 275)">
    <rect x="-20" y="-16" width="160" height="32" rx="16" fill="#0B1329" stroke="#06B6D4" stroke-width="1.5" filter="url(#dropShadow3D)" />
    <circle cx="-2" cy="0" r="5" fill="#06B6D4" />
    <text x="68" y="4" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PART III: RIGHTS</text>
  </g>

  <!-- Right Node: Courts -->
  <g transform="translate(680, 245)">
    <rect x="-20" y="-16" width="165" height="32" rx="16" fill="#0B1329" stroke="#F59E0B" stroke-width="1.5" filter="url(#dropShadow3D)" />
    <circle cx="-2" cy="0" r="5" fill="#F59E0B" />
    <text x="70" y="4" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">COURTS &amp; REMEDIES</text>
  </g>

  <!-- Bottom Node: Acts & Sanhitas -->
  <g transform="translate(450, 560)">
    <rect x="-100" y="-16" width="200" height="32" rx="16" fill="#0B1329" stroke="#818CF8" stroke-width="1.5" filter="url(#dropShadow3D)" />
    <circle cx="-80" cy="0" r="5" fill="#818CF8" />
    <text x="10" y="4" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STATUTORY CODES</text>
  </g>
</svg>