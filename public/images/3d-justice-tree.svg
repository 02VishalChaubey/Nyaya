<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Gradients for 3D Isometric Tree & Pediment -->
    <linearGradient id="treeGroundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1d38" />
      <stop offset="50%" stop-color="#16294d" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>
    <linearGradient id="treeTrunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996a22" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#7a5214" />
    </linearGradient>
    <linearGradient id="cyanNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="purpleNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="pillarGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="pillarGradR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#050b14" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Ambient Glows -->
  <circle cx="300" cy="220" r="160" fill="#0284c7" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="300" cy="180" r="100" fill="#eab308" opacity="0.1" filter="url(#softGlow)" />

  <!-- 3D Isometric Base / Pedestal -->
  <g transform="translate(300, 390)" filter="url(#cardShadow)">
    <!-- Bottom Shadow -->
    <polygon points="0,45 200,-50 0,-145 -200,-50" fill="#050b14" opacity="0.6" />
    
    <!-- Isometric Base Slab Left Side -->
    <polygon points="-200,-50 0,45 0,65 -200,-30" fill="#0d1b33" />
    <!-- Isometric Base Slab Right Side -->
    <polygon points="0,45 200,-50 200,-30 0,65" fill="#14284b" />
    <!-- Isometric Base Slab Top Face -->
    <polygon points="0,45 200,-50 0,-145 -200,-50" fill="url(#treeGroundGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Inset Isometric Stepped Tier -->
    <polygon points="0,20 150,-50 0,-120 -150,-50" fill="#122340" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- Subtle Grid Lines on Top Platform -->
    <line x1="-100" y1="-27" x2="50" y2="-97" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25" />
    <line x1="-50" y1="-4" x2="100" y2="-74" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25" />
    <line x1="-50" y1="-97" x2="100" y2="-27" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25" />
    <line x1="-100" y1="-74" x2="50" y2="-4" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25" />
  </g>

  <!-- 3D Root Column: The Constitution (Lex Suprema) -->
  <g transform="translate(300, 270)">
    <!-- Base Plinth of Column -->
    <polygon points="-40,40 0,60 40,40 0,20" fill="#d4af37" stroke="#996a22" stroke-width="1" />
    <polygon points="-40,40 0,60 0,72 -40,52" fill="#7a5214" />
    <polygon points="0,60 40,40 40,52 0,72" fill="#d4af37" />

    <!-- Isometric Central Constitutional Column (Trunk) -->
    <polygon points="-24,-50 0,-36 0,55 -24,41" fill="url(#pillarGradL)" />
    <polygon points="0,-36 24,-50 24,41 0,55" fill="url(#pillarGradR)" />
    <!-- Fluting detail -->
    <line x1="-12" y1="-43" x2="-12" y2="48" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="12" y1="-43" x2="12" y2="48" stroke="#1e293b" stroke-width="1.5" />

    <!-- Ashoka Chakra Hologram in Center Trunk -->
    <circle cx="0" cy="5" r="16" fill="#0f1d38" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="5" r="3" fill="#38bdf8" />
    <!-- 8 representative spokes -->
    <line x1="0" y1="-11" x2="0" y2="21" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
    <line x1="-16" y1="5" x2="16" y2="5" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
    <line x1="-11" y1="-6" x2="11" y2="16" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
    <line x1="-11" y1="16" x2="11" y2="-6" stroke="#38bdf8" stroke-width="1" opacity="0.8" />

    <!-- Capital of Column / Nexus Platform -->
    <polygon points="-48,-55 0,-30 48,-55 0,-80" fill="url(#treeTrunkGrad)" stroke="#fde047" stroke-width="1.5" />
    <polygon points="-48,-55 0,-30 0,-20 -48,-45" fill="#7a5214" />
    <polygon points="0,-30 48,-55 48,-45 0,-20" fill="#996a22" />
  </g>

  <!-- 3D Floating Branches Connecting to Tree Nodes -->
  <!-- Branch 1: Left Branch -> Part III Fundamental Rights (Cyan) -->
  <path d="M 300, 205 C 240, 180 180, 190 120, 170" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" opacity="0.8" />
  <path d="M 300, 205 C 240, 180 180, 190 120, 170" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />

  <!-- Sub-branch 1a: Life & Liberty -->
  <path d="M 120, 170 C 80, 160 60, 130 50, 100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />
  <!-- Sub-branch 1b: Equality & Writs -->
  <path d="M 120, 170 C 90, 195 70, 230 60, 260" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />

  <!-- Branch 2: Center Branch -> Apex Court & Judicial Hierarchy (Gold) -->
  <path d="M 300, 200 C 300, 140 300, 110 300, 60" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" opacity="0.8" />
  <path d="M 300, 200 C 300, 140 300, 110 300, 60" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />

  <!-- Branch 3: Right Branch -> Codified Statutory Law (Purple/Amber) -->
  <path d="M 300, 205 C 360, 180 420, 190 480, 170" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" opacity="0.8" />
  <path d="M 300, 205 C 360, 180 420, 190 480, 170" fill="none" stroke="#f3e8ff" stroke-width="2" stroke-linecap="round" />

  <!-- Sub-branch 3a: Criminal BNS -->
  <path d="M 480, 170 C 520, 160 540, 130 550, 100" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />
  <!-- Sub-branch 3b: Procedure BNSS & Civil -->
  <path d="M 480, 170 C 510, 195 530, 230 540, 260" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />

  <!-- 3D Node 1: Left - Fundamental Rights (Articles 12-35) -->
  <g transform="translate(120, 170)" filter="url(#cardShadow)">
    <circle cx="0" cy="0" r="32" fill="#0b192e" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="26" fill="url(#cyanNodeGrad)" opacity="0.9" />
    <!-- 3D Shield Icon Inside -->
    <path d="M 0,-14 L 12,-8 C 12,5 0,16 0,16 C 0,16 -12,5 -12,-8 Z" fill="#082f49" />
    <path d="M 0,-12 L 9,-7 C 9,4 0,13 0,13" fill="#38bdf8" opacity="0.8" />
    <path d="M -3,-1 L -1,1 L 4,-4" fill="none" stroke="#f0f9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Sub-node 1a: Life (Art 21) -->
  <g transform="translate(50, 100)">
    <circle cx="0" cy="0" r="14" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="7" fill="#38bdf8" />
  </g>
  <!-- Sub-node 1b: Remedies (Art 32) -->
  <g transform="translate(60, 260)">
    <circle cx="0" cy="0" r="14" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="7" fill="#38bdf8" />
  </g>

  <!-- 3D Node 2: Center Apex - Supreme Court & Constitutional Adjudication -->
  <g transform="translate(300, 60)" filter="url(#cardShadow)">
    <circle cx="0" cy="0" r="36" fill="#1c1917" stroke="#eab308" stroke-width="3" />
    <circle cx="0" cy="0" r="28" fill="url(#goldNodeGrad)" opacity="0.95" />
    <!-- 3D Scales of Justice in Apex Node -->
    <g transform="scale(0.85) translate(-14,-14)">
      <path d="M14 4v18M8 8h12M5 14l3-6 3 6zM17 14l3-6 3 6zM5 14a3 1.5 0 0 0 6 0M17 14a3 1.5 0 0 0 6 0" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- 3D Node 3: Right - Codified Acts & Statues (BNS, CrPC/BNSS, Civil) -->
  <g transform="translate(480, 170)" filter="url(#cardShadow)">
    <circle cx="0" cy="0" r="32" fill="#1e112a" stroke="#a855f7" stroke-width="2.5" />
    <circle cx="0" cy="0" r="26" fill="url(#purpleNodeGrad)" opacity="0.9" />
    <!-- 3D Open Book / Code of Law Icon Inside -->
    <path d="M -12,-8 C -6,-11 0,-8 0,-8 C 0,-8 6,-11 12,-8 L 12,10 C 6,7 0,10 0,10 C 0,10 -6,7 -12,10 Z" fill="#3b0764" />
    <line x1="0" y1="-8" x2="0" y2="10" stroke="#f3e8ff" stroke-width="1.5" />
    <path d="M -9,-4 C -5,-6 -2,-4 -2,-4 M -9,1 C -5,-1 -2,1 -2,1 M 2,-4 C 5,-6 9,-4 9,-4 M 2,1 C 5,-1 9,1 9,1" stroke="#e9d5ff" stroke-width="1.2" stroke-linecap="round" />
  </g>
  <!-- Sub-node 3a: Criminal Sanhita -->
  <g transform="translate(550, 100)">
    <circle cx="0" cy="0" r="14" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="0" cy="0" r="7" fill="#c084fc" />
  </g>
  <!-- Sub-node 3b: Special Enactments -->
  <g transform="translate(540, 260)">
    <circle cx="0" cy="0" r="14" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="0" cy="0" r="7" fill="#c084fc" />
  </g>

  <!-- Floating 3D Data Labels with Glass Badges -->
  <!-- Label Left -->
  <g transform="translate(50, 185)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="135" height="34" rx="6" fill="#0a1628" stroke="#38bdf8" stroke-width="1" opacity="0.92" />
    <text x="12" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">PART III CHARTER</text>
    <text x="12" y="27" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9">Articles 12–35</text>
  </g>

  <!-- Label Center Apex -->
  <g transform="translate(225, 2)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="150" height="34" rx="6" fill="#1c1917" stroke="#eab308" stroke-width="1" opacity="0.92" />
    <text x="14" y="15" fill="#fde047" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">APEX JUDICIARY</text>
    <text x="14" y="27" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9">Supreme Court &amp; Writs</text>
  </g>

  <!-- Label Right -->
  <g transform="translate(425, 185)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="135" height="34" rx="6" fill="#1a0c29" stroke="#a855f7" stroke-width="1" opacity="0.92" />
    <text x="12" y="16" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">STATUTORY CODES</text>
    <text x="12" y="27" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="9">BNS, BNSS, BSA, IT Act</text>
  </g>
</svg>
