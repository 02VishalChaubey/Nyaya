<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Soft 3D Ground Shadow -->
    <radialGradient id="bookShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0B1329" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Leather Cover Gradient (Deep Sovereign Navy) -->
    <linearGradient id="coverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="30%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#091322" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>

    <!-- 3D Spine Cylinder Gradient -->
    <linearGradient id="spineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="25%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="85%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 3D Gold Leaf Edges / Page Block Gradient -->
    <linearGradient id="giltPages" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#EAB308" />
      <stop offset="60%" stop-color="#CA8A04" />
      <stop offset="85%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>

    <!-- 3D Gold Foil Emboss Gradient -->
    <linearGradient id="goldEmboss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="20%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="90%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Holographic Bookmark Ribbon -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="glowBook" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 3D Ambient Ground Shadow -->
  <ellipse cx="300" cy="490" rx="220" ry="50" fill="url(#bookShadow)" />

  <!-- 3D Book Base Structure (Isometric View) -->
  <g transform="rotate(-6, 300, 300)">
    <!-- Back Cover (Bottom Layer) -->
    <polygon points="120,440 380,470 510,360 250,330" fill="#020617" />
    <polygon points="120,440 380,470 380,480 120,450" fill="#0A0F1D" />

    <!-- 3D Pages Block (Isometric Depth & Individual Page Ribs) -->
    <!-- Front page edge -->
    <polygon points="135,430 375,458 375,398 135,370" fill="url(#giltPages)" />
    <!-- Top page edge -->
    <polygon points="375,458 495,355 495,295 375,398" fill="url(#giltPages)" opacity="0.9" />

    <!-- Page Texture Lines (Simulating Thousands of Fine Parchment Pages) -->
    <line x1="135" y1="385" x2="375" y2="413" stroke="#713F12" stroke-width="1" opacity="0.4" />
    <line x1="135" y1="400" x2="375" y2="428" stroke="#FEF08A" stroke-width="0.8" opacity="0.6" />
    <line x1="135" y1="415" x2="375" y2="443" stroke="#713F12" stroke-width="1" opacity="0.4" />
    <line x1="375" y1="413" x2="495" y2="310" stroke="#713F12" stroke-width="1" opacity="0.4" />
    <line x1="375" y1="428" x2="495" y2="325" stroke="#FEF08A" stroke-width="0.8" opacity="0.6" />

    <!-- 3D Spine (Left Curved Edge) -->
    <path d="M 100,190 Q 90,285 100,380 L 135,370 Q 125,280 135,180 Z" fill="url(#spineGradient)" />
    <!-- Spine Gold Decorative Ribs -->
    <path d="M 97,220 Q 115,223 133,215" stroke="#FDE047" stroke-width="3" fill="none" opacity="0.8" />
    <path d="M 95,280 Q 115,283 131,275" stroke="#FDE047" stroke-width="3" fill="none" opacity="0.8" />
    <path d="M 97,340 Q 115,343 133,335" stroke="#FDE047" stroke-width="3" fill="none" opacity="0.8" />

    <!-- 3D Front Cover Plate (Tilted Upper Plane) -->
    <!-- Cover Base Slab with Beveled Gold Trim -->
    <polygon points="135,180 385,215 505,120 255,85" fill="url(#coverGradient)" stroke="#1E293B" stroke-width="2" />
    <!-- Gilded Border Trim Inlay -->
    <polygon points="150,185 375,215 488,128 263,98" fill="none" stroke="url(#goldEmboss)" stroke-width="2.5" />
    <polygon points="156,188 370,217 480,133 266,104" fill="none" stroke="#FDE047" stroke-width="0.8" stroke-dasharray="6,4" opacity="0.7" />

    <!-- Corner Filigree Ornaments on Front Cover -->
    <g stroke="url(#goldEmboss)" stroke-width="2" fill="none">
      <path d="M 160,192 L 180,195 M 160,192 L 168,180" />
      <path d="M 365,214 L 345,211 M 365,214 L 375,200" />
      <path d="M 475,135 L 455,138 M 475,135 L 468,145" />
      <path d="M 270,107 L 290,104 M 270,107 L 263,118" />
    </g>

    <!-- 3D Embossed Center Medallion: Ashoka Chakra / Constitution Emblem -->
    <g transform="translate(320, 150) scale(1, 0.65) rotate(18)">
      <!-- Outer Relief Ring -->
      <circle cx="0" cy="0" r="48" fill="url(#coverGradient)" stroke="url(#goldEmboss)" stroke-width="3.5" filter="url(#glowBook)" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#FEF08A" stroke-width="1.2" opacity="0.7" />
      <!-- Central Ashoka Hub & Rays -->
      <circle cx="0" cy="0" r="10" fill="url(#goldEmboss)" />
      <!-- 24 Chakra Spokes -->
      <g stroke="url(#goldEmboss)" stroke-width="1.8">
        <line x1="0" y1="-40" x2="0" y2="40" />
        <line x1="-40" y1="0" x2="40" y2="0" />
        <line x1="-28" y1="-28" x2="28" y2="28" />
        <line x1="-28" y1="28" x2="28" y2="-28" />
        <line x1="-15" y1="-37" x2="15" y2="37" />
        <line x1="-37" y1="-15" x2="37" y2="15" />
        <line x1="-37" y1="15" x2="37" y2="-15" />
        <line x1="-15" y1="37" x2="15" y2="-37" />
      </g>
    </g>

    <!-- 3D Flowing Satin Bookmark Ribbon -->
    <path d="M 255,85 C 240,140 260,250 210,380 C 185,440 220,470 200,500 L 225,505 L 245,470 C 275,410 270,260 280,160 Z" fill="url(#ribbonGrad)" filter="url(#glowBook)" opacity="0.95" />
    <!-- Ribbon V-notch at bottom end -->
    <polygon points="200,500 225,505 212,490" fill="#020617" opacity="0.6" />
    <path d="M 200,500 L 212,490 L 225,505" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.8" />

    <!-- Gilded Cover Typography: "CONSTITUTION OF INDIA" -->
    <g transform="translate(325, 195) rotate(7) skewX(-14)">
      <text x="0" y="0" text-anchor="middle" font-family="'Lora', 'Georgia', serif" font-size="12" font-weight="700" letter-spacing="4" fill="url(#goldEmboss)">
        CONSTITUTION OF INDIA
      </text>
      <text x="0" y="14" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#38BDF8">
        PART III • FUNDAMENTAL RIGHTS
      </text>
    </g>
  </g>
</svg>
