<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E18" />
      <stop offset="50%" stop-color="#0F1826" />
      <stop offset="100%" stop-color="#070C14" />
    </linearGradient>
    
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Plate -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle decorative grid & circuits in background -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1">
    <line x1="80" y1="60" x2="720" y2="60" stroke-dasharray="6,8" />
    <line x1="80" y1="440" x2="720" y2="440" stroke-dasharray="6,8" />
    <line x1="120" y1="60" x2="120" y2="440" stroke-dasharray="4,8" />
    <line x1="680" y1="60" x2="680" y2="440" stroke-dasharray="4,8" />
  </g>

  <!-- Central Emblem Container -->
  <g transform="translate(400, 160)" filter="url(#neonGlow)">
    <!-- Circuit Pillar & Traces -->
    <path d="M 0 -85 L 0 -40 M -35 -75 L -35 -40 M 35 -75 L 35 -40" stroke="url(#glowCyan)" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="-85" r="4" fill="#38BDF8" />
    <circle cx="-35" cy="-75" r="3.5" fill="#38BDF8" />
    <circle cx="35" cy="-75" r="3.5" fill="#38BDF8" />

    <!-- Scales Crossbeam & Circuit Bus -->
    <path d="M -140 -35 L 140 -35" stroke="url(#glowCyan)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M -150 -35 L -140 -45 L -70 -45 M 150 -35 L 140 -45 L 70 -45" stroke="url(#glowPurple)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="-150" cy="-35" r="4" fill="#818CF8" />
    <circle cx="150" cy="-35" r="4" fill="#818CF8" />

    <!-- Left Scale Chain & Pan -->
    <g transform="translate(-130, -35)">
      <line x1="0" y1="0" x2="-35" y2="65" stroke="url(#glowPurple)" stroke-width="2.2" />
      <line x1="0" y1="0" x2="35" y2="65" stroke="url(#glowPurple)" stroke-width="2.2" />
      <!-- Pan structure -->
      <path d="M -42 65 Q 0 85 42 65 Z" fill="#0F172A" stroke="url(#glowPurple)" stroke-width="3" />
      <path d="M -25 72 Q 0 82 25 72" stroke="#38BDF8" stroke-width="1.8" fill="none" opacity="0.8" />
    </g>

    <!-- Right Scale Chain & Pan -->
    <g transform="translate(130, -35)">
      <line x1="0" y1="0" x2="-35" y2="65" stroke="url(#glowCyan)" stroke-width="2.2" />
      <line x1="0" y1="0" x2="35" y2="65" stroke="url(#glowCyan)" stroke-width="2.2" />
      <!-- Pan structure -->
      <path d="M -42 65 Q 0 85 42 65 Z" fill="#0F172A" stroke="url(#glowCyan)" stroke-width="3" />
      <path d="M -25 72 Q 0 82 25 72" stroke="#818CF8" stroke-width="1.8" fill="none" opacity="0.8" />
    </g>

    <!-- Center Circuit Monogram Frame -->
    <g transform="translate(0, 5)">
      <!-- Outer circuit traces -->
      <path d="M -60 -20 L -45 -20 L -45 40 L -60 40" stroke="url(#glowPurple)" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <circle cx="-60" cy="-20" r="3" fill="#A855F7" />
      <circle cx="-60" cy="40" r="3" fill="#A855F7" />
      
      <path d="M 60 -20 L 45 -20 L 45 40 L 60 40" stroke="url(#glowPurple)" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <circle cx="60" cy="-20" r="3" fill="#A855F7" />
      <circle cx="60" cy="40" r="3" fill="#A855F7" />

      <!-- Stylized Monogram "EM" -->
      <g filter="url(#softGlow)">
        <!-- E -->
        <path d="M -30 -25 L -7 -25 M -30 -25 L -30 35 M -30 5 L -12 5 M -30 35 L -7 35" stroke="url(#metalSilver)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- M -->
        <path d="M 2 35 L 2 -25 L 17 5 L 32 -25 L 32 35" stroke="url(#metalSilver)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>

    <!-- Bottom Pedestal Circuit Traces -->
    <path d="M -45 55 L -25 75 L 25 75 L 45 55" stroke="url(#glowCyan)" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M -35 85 L 35 85" stroke="url(#glowPurple)" stroke-width="3" stroke-linecap="round" />
    <circle cx="-35" cy="85" r="3.5" fill="#818CF8" />
    <circle cx="35" cy="85" r="3.5" fill="#818CF8" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <!-- Brand Title -->
    <text x="400" y="360" font-family="'Inter', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="10" fill="#FFFFFF">
      ENMACHI
    </text>

    <!-- Hindi Motto: न्याय • विधि • ज्ञान -->
    <text x="400" y="405" font-family="'Noto Sans Devanagari', 'Mangal', 'Arial Unicode MS', sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#E2E8F0">
      न्याय  •  विधि  •  ज्ञान
    </text>

    <!-- Subtitle: The Wisdom of the Judge -->
    <text x="400" y="440" font-family="'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#38BDF8" text-transform="uppercase">
      The Wisdom of the Judge
    </text>
  </g>
</svg>
