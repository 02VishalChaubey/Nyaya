<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="deepDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="40%" stop-color="#091322" />
      <stop offset="80%" stop-color="#0D1A2D" />
      <stop offset="100%" stop-color="#060C16" />
    </linearGradient>

    <radialGradient id="cyberGlowCyan" cx="70%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#0284C7" stop-opacity="0.0" />
    </radialGradient>

    <radialGradient id="cyberGlowPurple" cx="80%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.0" />
    </radialGradient>

    <linearGradient id="circuitCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="circuitPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="templeFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0B1320" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#38BDF8" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Deep Base Canvas -->
  <rect width="100%" height="100%" fill="url(#deepDark)" />

  <!-- Digital Grid Texture -->
  <rect width="100%" height="100%" fill="url(#dotGrid)" />

  <!-- Ambient Light Orbs -->
  <rect width="100%" height="100%" fill="url(#cyberGlowCyan)" />
  <rect width="100%" height="100%" fill="url(#cyberGlowPurple)" />

  <!-- Temple Architectural Silhouette (Background) -->
  <g opacity="0.28" fill="url(#templeFade)">
    <!-- Temple Pillars -->
    <rect x="1100" y="240" width="42" height="840" rx="4" />
    <rect x="1800" y="240" width="42" height="840" rx="4" />
    
    <!-- Torii / Temple Curved Roofline -->
    <path d="M 1020 320 Q 1480 260 1900 320 L 1900 360 Q 1480 300 1020 360 Z" />
    <path d="M 1080 375 L 1840 375 L 1840 405 L 1080 405 Z" />
    <!-- Secondary inner roof contour -->
    <path d="M 1200 180 Q 1480 140 1760 180 L 1760 215 Q 1480 175 1200 215 Z" />
  </g>

  <!-- Cybernetic Circuit Pathways (Background Matrix) -->
  <g opacity="0.35" stroke-linecap="round">
    <!-- Flowing circuit lines across right & center -->
    <path d="M 650 300 L 950 300 L 1050 400 L 1450 400" stroke="url(#circuitCyan)" stroke-width="2" fill="none" />
    <path d="M 750 650 L 1000 650 L 1120 530 L 1500 530" stroke="url(#circuitPurple)" stroke-width="2" fill="none" />
    <path d="M 850 150 L 1150 150 L 1250 250 L 1650 250" stroke="url(#circuitCyan)" stroke-width="1.5" fill="none" stroke-dasharray="8,6" />
    <path d="M 920 850 L 1200 850 L 1320 730 L 1780 730" stroke="url(#circuitCyan)" stroke-width="2" fill="none" />
    
    <!-- Vertical and angular bus trunks -->
    <path d="M 1480 120 L 1480 350" stroke="url(#circuitCyan)" stroke-width="2.5" />
    <path d="M 1480 720 L 1480 960" stroke="url(#circuitPurple)" stroke-width="2.5" />
    <path d="M 1250 450 L 1200 500 L 1200 800" stroke="url(#circuitCyan)" stroke-width="1.8" fill="none" />
    <path d="M 1720 450 L 1770 500 L 1770 800" stroke="url(#circuitPurple)" stroke-width="1.8" fill="none" />
    
    <!-- Circuit Terminal Nodes -->
    <circle cx="950" cy="300" r="4.5" fill="#38BDF8" />
    <circle cx="1050" cy="400" r="5" fill="#818CF8" />
    <circle cx="1000" cy="650" r="4.5" fill="#C084FC" />
    <circle cx="1120" cy="530" r="5" fill="#38BDF8" />
    <circle cx="1480" cy="120" r="6" fill="#38BDF8" />
    <circle cx="1480" cy="960" r="6" fill="#A855F7" />
    <circle cx="1200" cy="800" r="4" fill="#38BDF8" />
    <circle cx="1770" cy="800" r="4" fill="#C084FC" />
  </g>

  <!-- Luminous Cybernetic Scales of Justice & Enmachi Motif (Dominant Right Side) -->
  <g transform="translate(1480, 520)" filter="url(#glowLight)">
    <!-- Aura Pulse Rings -->
    <circle cx="0" cy="-30" r="280" stroke="#38BDF8" stroke-width="1" fill="none" opacity="0.15" stroke-dasharray="10,12" />
    <circle cx="0" cy="-30" r="220" stroke="#818CF8" stroke-width="1.5" fill="none" opacity="0.25" stroke-dasharray="16,8" />
    <circle cx="0" cy="-30" r="150" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.3" />

    <!-- Central Scales Pillar (Circuit Spire) -->
    <line x1="0" y1="-260" x2="0" y2="180" stroke="url(#circuitCyan)" stroke-width="5" stroke-linecap="round" />
    <line x1="-12" y1="-220" x2="-12" y2="120" stroke="url(#circuitPurple)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="12" y1="-220" x2="12" y2="120" stroke="url(#circuitPurple)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Spire Jewel / Crown Node -->
    <g filter="url(#intenseGlow)">
      <circle cx="0" cy="-260" r="14" fill="#E0F2FE" />
      <polygon points="0,-285 10,-260 0,-235 -10,-260" fill="#38BDF8" />
    </g>

    <!-- Glowing Horizontal Balance Beam -->
    <path d="M -260 -120 L 260 -120" stroke="url(#circuitCyan)" stroke-width="6" stroke-linecap="round" />
    <path d="M -240 -135 L -100 -135 L -60 -120 L 60 -120 L 100 -135 L 240 -135" stroke="url(#circuitPurple)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85" />
    <circle cx="-260" cy="-120" r="8" fill="#38BDF8" />
    <circle cx="260" cy="-120" r="8" fill="#818CF8" />

    <!-- Left Scale (Glowing Pan & Chains) -->
    <g transform="translate(-240, -120)">
      <!-- Suspension Strings -->
      <line x1="0" y1="0" x2="-55" y2="170" stroke="url(#circuitPurple)" stroke-width="2.8" opacity="0.85" />
      <line x1="0" y1="0" x2="55" y2="170" stroke="url(#circuitPurple)" stroke-width="2.8" opacity="0.85" />
      <!-- Luminous Scale Pan -->
      <path d="M -75 170 Q 0 220 75 170 Z" fill="#0C1527" stroke="url(#circuitPurple)" stroke-width="4.5" />
      <path d="M -50 185 Q 0 210 50 185" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.9" />
      <circle cx="0" cy="180" r="6" fill="#A855F7" filter="url(#intenseGlow)" />
    </g>

    <!-- Right Scale (Glowing Pan & Chains) -->
    <g transform="translate(240, -120)">
      <!-- Suspension Strings -->
      <line x1="0" y1="0" x2="-55" y2="170" stroke="url(#circuitCyan)" stroke-width="2.8" opacity="0.85" />
      <line x1="0" y1="0" x2="55" y2="170" stroke="url(#circuitCyan)" stroke-width="2.8" opacity="0.85" />
      <!-- Luminous Scale Pan -->
      <path d="M -75 170 Q 0 220 75 170 Z" fill="#0C1527" stroke="url(#circuitCyan)" stroke-width="4.5" />
      <path d="M -50 185 Q 0 210 50 185" stroke="#818CF8" stroke-width="2.5" fill="none" opacity="0.9" />
      <circle cx="0" cy="180" r="6" fill="#38BDF8" filter="url(#intenseGlow)" />
    </g>

    <!-- Center Monogram 'EM' Shield -->
    <g transform="translate(0, -30)" filter="url(#intenseGlow)">
      <!-- Hexagonal / Octagonal Tech Medallion -->
      <polygon points="0,-75 55,-40 55,40 0,75 -55,40 -55,-40" fill="#070E1A" stroke="url(#circuitCyan)" stroke-width="3.5" />
      <polygon points="0,-60 44,-32 44,32 0,60 -44,32 -44,-32" fill="none" stroke="url(#circuitPurple)" stroke-width="1.8" opacity="0.7" />

      <!-- Stylized Monogram E M -->
      <!-- E -->
      <path d="M -32 -26 L -8 -26 M -32 -26 L -32 26 M -32 0 L -14 0 M -32 26 L -8 26" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- M -->
      <path d="M 5 26 L 5 -26 L 19 2 L 33 -26 L 33 26" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Base Pedestal & Energy Waves -->
    <g transform="translate(0, 180)">
      <path d="M -90 0 L -40 25 L 40 25 L 90 0" stroke="url(#circuitCyan)" stroke-width="4" fill="none" stroke-linecap="round" />
      <path d="M -140 25 L -70 50 L 70 50 L 140 25" stroke="url(#circuitPurple)" stroke-width="3" fill="none" stroke-linecap="round" />
      <line x1="-180" y1="50" x2="180" y2="50" stroke="#38BDF8" stroke-width="2" opacity="0.5" stroke-dasharray="12,8" />
    </g>

    <!-- Hindi Motto Watermark: न्याय • विधि • ज्ञान -->
    <g opacity="0.4" text-anchor="middle">
      <text x="0" y="320" font-family="'Noto Sans Devanagari', 'Mangal', 'Arial Unicode MS', sans-serif" font-size="38" font-weight="700" letter-spacing="8" fill="#CBD5E1">
        न्याय  •  विधि  •  ज्ञान
      </text>
      <text x="0" y="365" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#38BDF8">
        THE WISDOM OF THE JUDGE
      </text>
    </g>
  </g>

  <!-- Foreground Atmospheric Vignette / Readability Shading -->
  <!-- Left Side Gradient Mask: Ensuring 100% WCAG Contrast for Left/Center Text Content -->
  <linearGradient id="textProtector" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#050B14" stop-opacity="0.97" />
    <stop offset="45%" stop-color="#050B14" stop-opacity="0.88" />
    <stop offset="70%" stop-color="#050B14" stop-opacity="0.45" />
    <stop offset="100%" stop-color="#050B14" stop-opacity="0.1" />
  </linearGradient>
  <rect width="100%" height="100%" fill="url(#textProtector)" />

  <!-- Bottom Gradient: Smooth transition to the page content / function bar -->
  <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="75%" stop-color="#050B14" stop-opacity="0" />
    <stop offset="100%" stop-color="#050B14" stop-opacity="0.85" />
  </linearGradient>
  <rect width="100%" height="100%" fill="url(#bottomFade)" />
</svg>
